<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Estoque</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Fundo geral da página de login */
        .auth-body {
            background-color: #f5f6fa; /* Mesma cor de fundo do sistema */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Caixa centralizada do formulário */
        .login-card {
            background: white;
            padding: 0; /* O padding será controlado pelos elementos internos */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            overflow: hidden; /* Garante que os cantos arredondados do topo funcionem */
        }

        /* Título com Fundo Azul do Sistema */
        .login-header {
            background-color: #34495e; /* Fundo azul do cabeçalho */
            color: white;
            padding: 25px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            border-bottom: 3px solid #3498db; /* Borda azul mais clara */
        }

        /* Área interna do formulário */
        .login-content {
            padding: 30px;
        }

        /* Grupos de formulário no padrão do sistema */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #34495e; /* Mesma cor de texto do sistema */
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd1d9; /* Cor de borda padrão */
            border-radius: 8px; /* Arredondamento padrão */
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #3498db; /* Foco azul claro */
            outline: none;
        }

        /* Botão Login no Padrão do Sistema */
        .btn-login {
            background-color: #3498db; /* Azul claro do botão de salvar */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
            display: block;
            margin-top: 25px;
        }

        .btn-login:hover {
            background-color: #2c3e50; /* Azul escuro no hover */
        }

        /* Link de cadastro no final */
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .register-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="auth-body">
    <div class="login-card">
        <h1 class="login-header">Login</h1>
        
        <div class="login-content">
            <form action="{{ url_for('autenticar') }}" method="POST">
                <div class="form-group">
                    <label>Nome de Usuário (Login):</label>
                    <input type="text" name="username" required placeholder="Digite seu usuário" class="input-full">
                </div>

                <div class="form-group">
                    <label>Senha:</label>
                    <input type="password" name="senha" required placeholder="Digite sua senha" class="input-full">
                </div>

                <button type="submit" class="btn-login">
                    <i class="fa fa-sign-in-alt"></i> Entrar
                </button>
                
                <p class="register-link">
                    Ainda não tem conta? <a href="{{ url_for('cadastro_usuario') }}">Cadastre-se</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
