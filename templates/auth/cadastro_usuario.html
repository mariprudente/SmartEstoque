<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - Smart Estoque</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Força o fundo da tela de autenticação */
        .auth-body {
            background-color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Caixa centralizada do formulário */
        .auth-container {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .auth-container h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }

        /* Grupos de formulário */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd1d9;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #3498db;
            outline: none;
        }

        /* Botões */
        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-save {
            background-color: #2ecc71;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background-color: #27ae60;
        }

        .btn-back {
            text-align: center;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
            padding: 10px;
            border: 1px solid #ccd1d9;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background-color: #f5f6fa;
            color: #34495e;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-container">
        <h1><i class="fa fa-user-plus" style="color: #3498db; margin-right: 10px;"></i>Novo Usuário</h1>
        
        <form action="{{ url_for('cadastro_usuario') }}" method="POST">
            <div class="form-group">
                <label>Nome Completo:</label>
                <input type="text" name="nome_completo" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label>Nome de Usuário (Login):</label>
                <input type="text" name="username" required placeholder="Ex: daniel.silva">
            </div>

            <div class="form-group">
                <label>Função:</label>
                <select name="funcao" required>
                    <option value="" disabled selected>Selecione uma função</option>
                    <option value="Gerente">Gerente</option>
                    <option value="Proprietário">Proprietário</option>
                    <option value="Funcionário">Funcionário</option>
                    <option value="Vendedor">Vendedor</option>
                </select>
            </div>

            <div class="form-group">
                <label>Senha:</label>
                <input type="password" name="senha" required placeholder="Crie uma senha">
            </div>

            <div class="auth-buttons">
                <button type="submit" class="btn-save">Salvar Usuário</button>
                <a href="{{ url_for('login') }}" class="btn-back">Voltar ao Login</a>
            </div>
        </form>
    </div>
</body>
</html>
