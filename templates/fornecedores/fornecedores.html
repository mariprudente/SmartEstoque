{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h2>Gestão de Fornecedores</h2>
    <button class="btn-main" onclick="document.getElementById('modalFornecedor').style.display='block'">
        <i class="fas fa-plus"></i> Novo Fornecedor
    </button>

    <table class="table-estoque">
        <thead>
            <tr>
                <th>Razão Social</th>
                <th>CNPJ</th>
                <th>Contato</th>
                <th>Cidade/UF</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for f in fornecedores %}
            <tr>
                <td>{{ f.razao_social }}</td>
                <td>{{ f.cnpj }}</td>
                <td>{{ f.nome_contato }}</td>
                <td>{{ f.cidade }}/{{ f.estado }}</td>
                <td>
                    <a href="{{ url_for('visualizar_fornecedor', id=f.id) }}" class="btn-icon blue"><i class="fas fa-eye"></i></a>
                    <a href="{{ url_for('editar_fornecedor', id=f.id) }}" class="btn-icon orange"><i class="fas fa-edit"></i></a>
                    <a href="{{ url_for('excluir_fornecedor', id=f.id) }}" class="btn-icon red" onclick="return confirm('Excluir fornecedor?')"><i class="fas fa-trash"></i></a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<div id="modalFornecedor" class="modal">
    <div class="modal-content">
        <span class="close" onclick="document.getElementById('modalFornecedor').style.display='none'">&times;</span>
        <h3>Cadastrar Fornecedor</h3>
        <form action="{{ url_for('salvar_fornecedor') }}" method="POST" class="form-grid">
            <input type="text" name="razao_social" placeholder="Razão Social" required>
            <input type="text" name="cnpj" placeholder="CNPJ">
            <input type="text" name="nome_contato" placeholder="Nome do Contato">
            <input type="text" name="email" placeholder="E-mail">
            <input type="text" name="telefone" placeholder="Telefone">
            <input type="text" name="celular" placeholder="Celular">
            <input type="text" name="cidade" placeholder="Cidade">
            <input type="text" name="estado" placeholder="UF">
            <textarea name="observacoes" placeholder="Observações" style="grid-column: span 2;"></textarea>
            <button type="submit" class="btn-save">Salvar Fornecedor</button>
        </form>
    </div>
</div>
{% endblock %}
