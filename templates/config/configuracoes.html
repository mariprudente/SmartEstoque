{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2><i class="fa fa-gear"></i> Configurações do Sistema</h2>

    <div class="config-grid">
        <div class="card-box">
            <h3><i class="fa fa-edit"></i> Nome do Sistema</h3>
            <form action="{{ url_for('atualizar_nome_sistema') }}" method="POST">
                <input type="text" name="nome_sistema" value="{{ session.get('nome_sistema', 'SMART ESTOQUE') }}" class="input-full">
                <button type="submit" class="btn-save" style="margin-top: 10px;">Alterar Nome</button>
            </form>
        </div>

        <div class="card-box d-flex-column">
            <h3><i class="fa fa-building"></i> Empresa e Usuários</h3>
            <a href="{{ url_for('dados_empresa') }}" class="btn-main" style="margin-bottom: 10px; display: block; text-align: center;">
                <i class="fa fa-id-card"></i> Dados da Empresa
            </a>
            <a href="{{ url_for('gerenciar_usuarios') }}" class="btn-main" style="display: block; text-align: center; background: #34495e;">
                <i class="fa fa-users-gear"></i> Gerenciar Usuários
            </a>
        </div>
    </div>
</div>

<style>
    .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .d-flex-column { display: flex; flex-direction: column; justify-content: center; }
</style>
{% endblock %}
