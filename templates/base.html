<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Smart Estoque</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; }

        .main-container { display: flex; width: 100%; }
        
        /* Onde o conteúdo das outras páginas vai aparecer */
        .content { flex: 1; padding: 40px; }

        /* Estilos globais para tabelas e botões que você já usa */
        .table-estoque { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        .table-estoque th, .table-estoque td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        .btn-main { background: #2c3e50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; }
        .btn-icon { padding: 5px 10px; border-radius: 4px; color: white; text-decoration: none; margin-right: 5px; }
        .blue { background: #3498db; } .orange { background: #e67e22; } .red { background: #e74c3c; }
        
        /* Modal simples */
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 50%; border-radius: 10px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-save { grid-column: span 2; background: #2ecc71; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="main-container">
        {% include 'layout/menu.html' %}

        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
