<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Smart Estoque</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
</head>
<body>
    <div class="container">
        {% include 'menu.html' %}

        <div class="content">
            <h2 style="margin-bottom: 25px;">👥 Gerenciamento de Clientes</h2>

            <div class="tabs" style="margin-bottom: 0px; display: flex;">
                <button id="defaultOpen" class="tablink" onclick="openTab(event, 'cadastro')" style="padding: 12px 25px; border-radius: 10px 10px 0 0; border: none; cursor: pointer; font-weight: bold; transition: 0.3s;">Cadastro</button>
                <button class="tablink" onclick="openTab(event, 'consulta')" style="padding: 12px 25px; border-radius: 10px 10px 0 0; border: none; cursor: pointer; font-weight: bold; margin-left: 5px; transition: 0.3s;">Consulta</button>
            </div>

            <div id="cadastro" class="tabcontent">
                <div class="form-box" style="background: #ffffff; padding: 40px; border-radius: 0 15px 15px 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #4CAF50;">
                    <h3 style="margin-bottom: 25px; color: #333;"><i class="fa fa-user-plus"></i> Novo Cliente</h3>
                    
                    <form method="POST" action="/salvar_cliente">
                        <div style="margin-bottom: 20px;">
                            <label style="font-weight: 600; color: #555;">Nome Completo</label>
                            <input type="text" name="nome" required style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;">
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                            <div>
                                <label style="font-weight: 600; color: #555;">CPF</label>
                                <input type="text" id="cpf" name="cpf" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;">
                            </div>
                            <div>
                                <label style="font-weight: 600; color: #555;">RG</label>
                                <input type="text" id="rg" name="rg" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;">
                            </div>
                            <div>
                                <label style="font-weight: 600; color: #555;">Nascimento</label>
                                <input type="text" id="nascimento" name="nascimento" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;">
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 3fr 1fr; gap: 15px; margin-bottom: 20px;">
                            <div>
                                <label style="font-weight: 600; color: #555;">Rua/Logradouro</label>
                                <input type="text" name="rua" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;">
                            </div>
                            <div>
                                <label style="font-weight: 600; color: #555;">Nº</label>
                                <input type="text" name="numero" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;">
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 20px;">
                            <div>
                                <label style="font-weight: 600; color: #555;">Cidade</label>
                                <input type="text" name="cidade" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;">
                            </div>
                            <div>
                                <label style="font-weight: 600; color: #555;">Estado (UF)</label>
                                <input type="text" name="estado" maxlength="2" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;">
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 15px; margin-bottom: 30px;">
                            <div>
                                <label style="font-weight: 600; color: #555;">Telefone</label>
                                <input type="text" id="telefone" name="telefone" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;">
                            </div>
                            <div>
                                <label style="font-weight: 600; color: #555;">Celular</label>
                                <input type="text" id="celular" name="celular" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;">
                            </div>
                            <div>
                                <label style="font-weight: 600; color: #555;">E-mail</label>
                                <input type="email" name="email" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;">
                            </div>
                        </div>

                        <button type="submit" style="width: 100%; padding: 15px; background: #1976d2; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px;">
                            <i class="fa fa-save"></i> CADASTRAR CLIENTE
                        </button>
                    </form>
                </div>
            </div>

            <div id="consulta" class="tabcontent" style="display:none;">
                <div class="table-box" style="background: #ffffff; padding: 30px; border-radius: 0 15px 15px 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #4CAF50;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 style="color: #333;"><i class="fa fa-users"></i> Clientes Cadastrados</h3>
                        <form method="GET" action="/clientes" style="display: flex; gap: 10px;">
                            <select name="tipo" style="padding: 8px; border-radius: 20px; border: 1px solid #ddd;">
                                <option value="nome">Nome</option>
                                <option value="cpf">CPF</option>
                            </select>
                            <input type="text" name="busca" placeholder="Pesquisar..." style="padding: 8px 15px; border: 1px solid #ddd; border-radius: 20px;">
                            <button type="submit" style="background: #1976d2; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer;"><i class="fa fa-search"></i></button>
                        </form>
                    </div>
                    
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background: #f8f9fa; text-align: left;">
                                <th style="padding: 15px; border-bottom: 2px solid #eee;">Nome</th>
                                <th style="padding: 15px; border-bottom: 2px solid #eee;">CPF</th>
                                <th style="padding: 15px; border-bottom: 2px solid #eee;">Celular</th>
                                <th style="padding: 15px; border-bottom: 2px solid #eee; text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for cliente in clientes %}
                            <tr style="border-bottom: 1px solid #eee; transition: 0.2s;" onmouseover="this.style.background='#fcfcfc'" onmouseout="this.style.background='white'">
                                <td style="padding: 12px; font-weight: 600; color: #333;">{{ cliente.nome }}</td>
                                <td style="padding: 12px; color: #666;">{{ cliente.cpf }}</td>
                                <td style="padding: 12px; color: #666;">{{ cliente.celular }}</td>
                                <td style="padding: 12px; text-align: center;">
                                    <div style="display: flex; gap: 8px; justify-content: center;">
                                        <a href="/cliente/{{ cliente.id }}" title="Detalhes" 
                                           style="background: #1976d2; color: white; padding: 6px 12px; display: flex; align-items: center; gap: 6px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold;">
                                            <i class="fa fa-search"></i> Visualizar
                                        </a>
                                        <a href="/excluir_cliente/{{ cliente.id }}" title="Excluir" onclick="return confirm('Excluir cliente?')"
                                           style="background: #d32f2f; color: white; padding: 6px 12px; display: flex; align-items: center; gap: 6px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold;">
                                            <i class="fa fa-trash"></i> Excluir
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
    function openTab(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tablink");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].style.background = "#e0e0e0";
            tablinks[i].style.color = "#555";
        }
        document.getElementById(tabName).style.display = "block";
        evt.currentTarget.style.background = "#1976d2";
        evt.currentTarget.style.color = "white";
    }

    $(document).ready(function(){
        $('#cpf').mask('000.000.000-00');
        $('#nascimento').mask('00/00/0000');
        $('#telefone').mask('(00) 0000-0000');
        $('#celular').mask('(00) 00000-0000');
    });

    document.getElementById("defaultOpen").click();
    </script>
</body>
</html>
