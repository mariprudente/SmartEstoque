<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PRODUTOS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="main-container" style="display: flex; min-height: 100vh;">

{% include 'layout/menu.html' %}
<div class="content">
    <h2>Detalhes do Produto: {{ produto.nome }}</h2>
    
    <form action="/produtos/editar/{{ produto.id }}" method="POST" enctype="multipart/form-data">
        <div class="detail-container">
            <div class="photo-section">
                {% if produto.foto %}
                    <img src="{{ url_for('static', filename='uploads/' + produto.foto) }}" alt="Foto do Produto" class="img-detalhe">
                {% else %}
                    <div class="no-photo">Sem Foto</div>
                {% endif %}
                <label>Alterar Foto:</label>
                <input type="file" name="foto">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Código:</label>
                    <input type="text" value="{{ produto.codigo_sequencial }}" readonly>
                </div>
                
                <div class="form-group">
                    <label>Nome do Produto:</label>
                    <input type="text" name="nome" value="{{ produto.nome }}">
                </div>

                <div class="form-group">
                    <label>Situação:</label>
                    <select name="situacao">
                        <option value="Ativo" {% if produto.situacao == 'Ativo' %}selected{% endif %}>Ativo</option>
                        <option value="Inativo" {% if produto.situacao == 'Inativo' %}selected{% endif %}>Inativo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Fornecedor:</label>
                    <select name="fornecedor_id">
                        {% for f in fornecedores %}
                        <option value="{{ f.id }}" {% if f.id == produto.fornecedor_id %}selected{% endif %}>{{ f.razao_social }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Marca:</label>
                    <input type="text" name="marca" value="{{ produto.marca }}">
                </div>

                <div class="form-group">
                    <label>Preço Compra (R$):</label>
                    <input type="number" step="0.01" name="preco_compra" value="{{ produto.preco_compra }}">
                </div>

                <div class="form-group">
                    <label>Preço Venda (R$):</label>
                    <input type="number" step="0.01" name="preco_venda" value="{{ produto.preco_venda }}">
                </div>

                <div class="form-group">
                    <label>Estoque Atual:</label>
                    <input type="number" name="qtd_estoque" value="{{ produto.qtd_estoque }}">
                </div>

                <div class="form-group">
                    <label>Estoque Mínimo:</label>
                    <input type="number" name="qtd_minima" value="{{ produto.qtd_minima }}">
                </div>
            </div>

            <div class="obs-section">
                <label>Observações:</label>
                <textarea name="observacoes" rows="5">{{ produto.observacoes }}</textarea>
            </div>
        </div>

        <div class="action-footer">
            <button type="submit" class="btn-save">Salvar Alterações</button>
            <a href="/produtos" class="btn-back">Voltar</a>
        </div>
    </form>
</div>
